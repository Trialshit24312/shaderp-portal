# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: shaderp-portal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_CALLBACK_URL
        sync: false
      - key: SYNC_API_KEY
        generateValue: true
      - key: DISCORD_INVITE_URL
        value: https://discord.gg/sbnu98HYAZ
      - key: PORTAL_ROLE_MAP
        sync: false
